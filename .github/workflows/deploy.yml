name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплой на VPS (/opt/dharana, compose-сервис web, контейнер dharana-web-app).
# Требуемые secrets (внесены 2026-09-13, те же, что у dharana-api):
#   DHARANA_SSH_HOST   - IP VPS (212.192.22.6)
#   DHARANA_SSH_PORT   - SSH-порт (7020)
#   DHARANA_SSH_USER   - пользователь deploy
#   DHARANA_SSH_KEY    - приватный ключ ~/.ssh/dharana_ci (BEGIN/END ED25519 без пароля)
# Деплой копирует исходники тарболом и пересобирает контейнер. NEXT_PUBLIC_*
# запекаются docker-сборкой из build.args в compose на VPS.

# Не даём двум пушам подряд пересобирать контейнер одновременно.
concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [build]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package sources
        run: git archive --format=tar.gz -o dharana-web-app.tar.gz HEAD

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DHARANA_SSH_HOST }}
          port: ${{ secrets.DHARANA_SSH_PORT }}
          username: ${{ secrets.DHARANA_SSH_USER }}
          key: ${{ secrets.DHARANA_SSH_KEY }}
          source: "dharana-web-app.tar.gz"
          target: "/tmp/dharana_deploy_${{ github.run_id }}"

      # Перед распаковкой чистим каталог: распаковка поверх НЕ удаляет файлы,
      # удалённые в репозитории, и они потом попадают в docker build context
      # (реальный кейс 2026-09-07 — старый app/favicon.ico победил новый icon.svg).
      # .env не трогаем: в нём NEXT_PUBLIC_* и секреты для compose.
      - name: Extract, rebuild, restart, verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DHARANA_SSH_HOST }}
          port: ${{ secrets.DHARANA_SSH_PORT }}
          username: ${{ secrets.DHARANA_SSH_USER }}
          key: ${{ secrets.DHARANA_SSH_KEY }}
          script: |
            set -e
            cd /opt/dharana
            sudo find ./dharana-web-app -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
            sudo tar -xzf /tmp/dharana_deploy_${{ github.run_id }}/dharana-web-app.tar.gz -C ./dharana-web-app
            sudo docker compose build web
            sudo docker compose up -d web
            sleep 12

            # Дымовые проверки. Без них деплой «успешен» даже при мёртвом сайте —
            # именно поэтому 2026-10-05 пришлось катить правки middleware вручную.
            set -e
            curl -fsS -o /dev/null https://dharana.ru/ru/login
            curl -fsS -o /dev/null https://api.dharana.ru/api/v1/health

            # Мост возврата из браузера в приложение (App Link-схема dharana://).
            # Если middleware снова начнёт заворачивать /app/auth/* в /ru, здесь будет 404.
            curl -fsS 'https://dharana.ru/app/auth/vk/callback?code=smoke&state=smoke' \
              | grep -q 'dharana://app/auth/vk/callback'
            echo "web deploy OK"